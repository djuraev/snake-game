<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game — Docker Edition</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>🐍 Snake</h1>
    <p class="subtitle">A tiny game for a tiny Docker image.</p>

    <div class="hud">
      <div class="stat">Score: <span id="score">0</span></div>
      <div class="stat">Best: <span id="best">0</span></div>
    </div>

    <div class="board">
      <canvas id="game" width="400" height="400"></canvas>
      <div id="overlay" class="overlay">
        <h2 id="overlayTitle">Ready?</h2>
        <p id="overlayText">Use arrow keys (or WASD) to move.</p>
        <p class="hint">Press <kbd>Space</kbd> to start</p>
      </div>
    </div>

    <p class="footer">KOICA MLOps Course — Docker &amp; Dockerfile Tutorial</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
